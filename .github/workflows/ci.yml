name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)\n      - run: ffmpeg -version | head -1\n      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
