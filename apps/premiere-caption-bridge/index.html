<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Subtitle · 캡션 적용</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">SUBTITLE · PREMIERE PRO</p><h1>캡션 트랙에 적용</h1></header>
    <p>Subtitle에서 저장한 편집본 문서를 열고, 적용할 시퀀스를 확인하세요.</p>
    <label for="document-file">Subtitle JSON 문서</label>
    <input id="document-file" type="file" accept=".json,application/json">
    <p id="document-summary" class="muted">아직 문서를 열지 않았습니다.</p>
    <section aria-labelledby="target-heading">
      <h2 id="target-heading">적용 대상</h2>
      <p id="target-summary">문서를 열면 Premiere의 활성 시퀀스를 확인합니다.</p>
      <button id="target-refresh" type="button" disabled>현재 시퀀스로 다시 확인</button>
    </section>
    <button id="caption-apply" class="primary" type="button" disabled>새 캡션 트랙 적용</button>
    <p id="status" role="status" aria-live="polite">편집본 문서의 타임라인 시작 시간을 그대로 사용합니다.</p>
    <p id="artifact-path" class="muted"></p>
    <details><summary>적용 범위</summary><p>기존 캡션은 유지하고 새 자막 트랙과 가져온 SRT 항목을 만듭니다. 적용용 SRT는 전용 데이터 폴더에 보존됩니다.</p><p>결과를 확인하지 못한 경우 자동으로 다시 적용하지 않습니다. Premiere에서 트랙을 확인하세요.</p></details>
  </main>
  <script src="vendor/CSInterface.js"></script>
  <script src="main.js"></script>
</body>
</html>
